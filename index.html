<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./index.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <button id="theme-toggle-btn">Click to change theme</button>
    <div id="container" class="container">
        <div class="top-section">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input id="input-el" placeholder="0">
            <div>
                <button id="convert-btn" class="convert-btn">Convert</button>
                <button id="clear-btn" class="clear-btn">Clear</button>
            </div>
        </div>
        <div id="length-container" class="bottom-section-container">
            <h2>Length (Meter/Feet)</h2>
            <h3 id="length-converter"></h3>
        </div>
        <div id="volume-container" class="bottom-section-container">
            <h2>Volume (Liters/Gallons)</h2>
            <h3 id="volume-converter"></h3>
        </div>
        <div id="mass-container" class="bottom-section-container">
            <h2>Mass (Kilograms/Pounds)</h2>
            <h3 id="mass-converter"></h3>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
